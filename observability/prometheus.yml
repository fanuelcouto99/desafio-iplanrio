global: 
  scrape_interval: 5s
rule_files: 
   - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: "prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["api:3000"]
  - job_name: "worker"
    static_configs:
      - targets: ["worker:9100"]
  - job_name: "rabbitmq"
    static_configs:
      - targets: ['rabbitmq:15692']